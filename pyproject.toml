[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "automax"
version = "0.1.0.dev0"
description = "AutoMaX: design and certify LLM-free pipelines with risk-coverage guarantees"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "scipy-stubs",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
amx = "amx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amx"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "T20"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"datasets/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
packages = ["amx"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["amx.spec.*", "amx.cert.*", "amx.loss.*"]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "pyarrow.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running statistical tests (make stat)",
    "network: needs outbound network to dataset mirrors",
]
filterwarnings = ["error::DeprecationWarning:amx.*"]
