repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --extra dev ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --extra dev mypy
        language: system
        pass_filenames: false
        types: [python]
